<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel · Olivé Spa</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" />
  <style>
    :root {
      --bg: #f7f2e9;
      --paper: #fffdf8;
      --sage: #dde5cf;
      --ink: #2c2a22;
      --ink-soft: #4b4839;
      --ink-mute: #837e6c;
      --accent: #6f6b3f;
      --accent-2: #b9924f;
      --line: rgba(44, 42, 34, 0.14);
      --error: #a8412f;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Montserrat", "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    body {
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .shell { width: min(640px, 100%); margin-inline: auto; padding: 1.5rem 1rem 10rem; }
    .brand { text-align: center; margin-bottom: 1.5rem; }
    .brand-name { font-family: var(--serif); font-weight: 600; font-size: 2.2rem; line-height: 1; }
    .brand-tag {
      margin-top: 0.4rem;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 1.5rem 1.25rem;
      box-shadow: 0 10px 30px -18px rgba(44, 42, 34, 0.35);
    }
    .cargando, .aviso { text-align: center; color: var(--ink-soft); }

    /* ---------- Entrar ---------- */
    .login { max-width: 400px; margin-inline: auto; display: grid; gap: 1rem; }
    .login h1 { font-family: var(--serif); font-weight: 600; font-size: 1.7rem; }
    .campo { display: grid; gap: 0.35rem; font-size: 0.85rem; font-weight: 500; color: var(--ink-soft); }
    .campo input, .campo textarea, .clave {
      width: 100%;
      font: 400 1rem var(--sans);
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
    }
    .campo textarea { resize: none; overflow: hidden; min-height: 5.5rem; line-height: 1.45; }
    .campo input:focus, .campo textarea:focus, .clave:focus-within { border-color: var(--accent); outline: none; }
    .clave { display: flex; align-items: center; gap: 0.5rem; padding: 0 0.4rem 0 0; }
    .clave input { flex: 1; border: 0; background: transparent; padding: 0.8rem 0.9rem; font: inherit; min-width: 0; }
    .clave input:focus-visible { outline: none; }
    .ver-clave { border: 0; background: none; color: var(--accent); font-size: 0.8rem; font-weight: 600; padding: 0.5rem; }
    .error { color: var(--error); font-size: 0.85rem; min-height: 1.3em; }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 0.85rem 1.4rem;
      background: var(--accent);
      color: var(--paper);
      font-weight: 600;
      font-size: 0.95rem;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: default; transform: none; }
    .btn-sec { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 0.85rem; text-decoration: underline; text-underline-offset: 3px; }

    /* ---------- Editor ---------- */
    .intro { display: flex; gap: 1rem; align-items: flex-start; justify-content: space-between; margin-bottom: 1.25rem; }
    .intro p { font-size: 0.9rem; color: var(--ink-soft); }
    .intro-acciones { display: grid; gap: 0.4rem; justify-items: end; flex-shrink: 0; }
    .intro-acciones a { color: var(--accent); font-weight: 600; font-size: 0.85rem; }
    .grupo { margin-bottom: 1.25rem; padding: 0; overflow: hidden; }
    .grupo h2 {
      padding: 0.9rem 1rem;
      background: var(--sage);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .fila { padding: 0.85rem 1rem; border-top: 1px solid var(--line); transition: background 0.2s; }
    .grupo h2 + .fila { border-top: 0; }
    .fila-principal { display: grid; grid-template-columns: 1fr auto; gap: 0.2rem 0.9rem; align-items: center; }
    .fila-texto { display: grid; gap: 0.1rem; min-width: 0; }
    .fila-nombre { font-weight: 500; font-size: 0.92rem; }
    .fila-detalle { font-size: 0.74rem; color: var(--ink-mute); }
    .precio {
      display: flex;
      align-items: baseline;
      gap: 0.15rem;
      padding: 0.35rem 0.7rem;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.2rem;
      cursor: text;
    }
    .precio:focus-within { border-color: var(--accent); }
    .precio input { width: 7.6ch; border: 0; background: transparent; font: inherit; color: var(--ink); text-align: right; padding: 0; }
    .precio input:focus-visible { outline: none; }
    .precio-nota { grid-column: 2; justify-self: end; font-size: 0.7rem; color: var(--ink-mute); }
    .fila-aviso { grid-column: 1 / -1; font-size: 0.74rem; color: var(--accent-2); font-weight: 500; }
    .fila-aviso:empty { display: none; }
    .fila.cambiado { background: rgba(185, 146, 79, 0.1); }
    .fila.cambiado .precio.modificado { border-color: var(--accent-2); }
    .fila.invalido .fila-aviso { color: var(--error); }

    .editar {
      margin-top: 0.55rem;
      border: 0;
      background: none;
      padding: 0.2rem 0;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
    }
    .editar::before { content: "✎ "; }
    .editar[aria-expanded="true"]::before { content: "▴ "; }
    .edicion { display: grid; gap: 0.9rem; margin-top: 0.7rem; padding-top: 0.9rem; border-top: 1px dashed var(--line); }
    .campo.modificado { color: var(--accent-2); }
    .campo.modificado input, .campo.modificado textarea { border-color: var(--accent-2); }
    .campo.invalido input { border-color: var(--error); }
    .foto-campo { display: flex; gap: 0.9rem; align-items: center; }
    .miniatura {
      width: 110px;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 12px;
      background: var(--sage);
      border: 1px solid var(--line);
      flex-shrink: 0;
    }
    .foto-acciones { display: grid; gap: 0.35rem; justify-items: start; }
    .btn-foto { display: inline-block; padding: 0.55rem 1rem; font-size: 0.82rem; cursor: pointer; }
    .foto-estado { font-size: 0.74rem; color: var(--ink-mute); font-weight: 400; }
    .foto-fila .foto-campo { margin-top: 0.6rem; }
    .nota-campo { font-weight: 400; color: var(--ink-mute); font-size: 0.74rem; }
    .galeria-editor { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.6rem; margin-top: 0.2rem; }
    .gal-foto { position: relative; display: grid; gap: 0.3rem; margin: 0; }
    .gal-foto img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
      background: var(--sage);
      border: 1px solid var(--line);
    }
    .gal-foto.nueva img { border: 2px solid var(--accent-2); }
    .gal-principal {
      position: absolute;
      top: 6px;
      left: 6px;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      background: rgba(44, 42, 34, 0.75);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 600;
    }
    .gal-acciones { display: flex; justify-content: space-between; gap: 0.2rem; }
    .gal-acciones button { border: 0; background: none; padding: 0.15rem 0; color: var(--accent); font-size: 0.72rem; font-weight: 600; }
    .gal-acciones button[data-quitar] { color: var(--error); margin-left: auto; }
    .gal-agregar {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border: 1.5px dashed var(--accent);
      border-radius: 12px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
      padding: 0.4rem;
      cursor: pointer;
      background: rgba(111, 107, 63, 0.04);
    }

    /* ---------- Barra inferior ---------- */
    .barra {
      position: fixed;
      inset: auto 0 0 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem 0.75rem;
      padding: 0.8rem 1rem calc(0.8rem + env(safe-area-inset-bottom));
      background: rgba(255, 253, 248, 0.97);
      border-top: 1px solid var(--line);
      box-shadow: 0 -10px 30px -20px rgba(44, 42, 34, 0.4);
    }
    /* Si los botones no dejan espacio, el mensaje pasa a su propia línea. */
    .barra-estado { flex: 1 1 9rem; font-size: 0.82rem; color: var(--ink-soft); }
    .barra-estado.ok { color: var(--accent); font-weight: 600; }
    .barra-estado.error { color: var(--error); font-weight: 600; }
    .barra-acciones { flex: 1 1 auto; display: flex; justify-content: flex-end; gap: 0.5rem; }
    .barra .btn { padding: 0.75rem 1.1rem; font-size: 0.88rem; }

    /* ---------- Confirmación ---------- */
    .dialogo {
      width: min(460px, calc(100% - 2rem));
      margin: auto; /* el reset de márgenes quita el centrado nativo del <dialog> */
      border: 0;
      border-radius: 20px;
      padding: 1.4rem 1.25rem;
      background: var(--paper);
      color: var(--ink);
    }
    .dialogo::backdrop { background: rgba(44, 42, 34, 0.5); }
    .dialogo h2 { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; margin-bottom: 0.9rem; }
    .resumen { list-style: none; padding: 0; display: grid; gap: 0.6rem; max-height: 55vh; overflow: auto; }
    .resumen li { display: grid; gap: 0.15rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--line); font-size: 0.86rem; }
    .resumen .r-titulo { font-weight: 600; }
    .resumen .r-detalle { color: var(--ink-soft); overflow-wrap: anywhere; }
    .resumen s { color: var(--ink-mute); }
    .resumen strong { color: var(--accent); }
    .resumen .r-aviso { color: var(--error); font-weight: 600; font-size: 0.8rem; }
    .resumen img { width: 88px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; margin-top: 0.3rem; }
    .r-fotos { display: flex; gap: 0.4rem; }
    .r-fotos img { width: 64px; aspect-ratio: 1; }
    .dialogo-acciones { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.1rem; }

    @media (min-width: 560px) {
      .shell { padding-top: 2.5rem; }
      .card { padding: 2rem 1.75rem; }
      .grupo { padding: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <p class="brand-name">Olivé Spa</p>
      <p class="brand-tag">Panel de administración</p>
    </header>

    <p class="cargando" data-vista="cargando">Cargando…</p>

    <form class="card login" data-vista="login" data-login hidden novalidate>
      <h1>Entrar</h1>
      <label class="campo">Usuario
        <input name="usuario" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" />
      </label>
      <label class="campo">Contraseña
        <span class="clave">
          <input name="clave" type="password" autocomplete="current-password" />
          <button class="ver-clave" type="button" data-ver-clave aria-label="Mostrar contraseña">Ver</button>
        </span>
      </label>
      <p class="error" role="alert" data-error-login></p>
      <button class="btn" type="submit" data-entrar>Entrar</button>
    </form>

    <div class="card aviso" data-vista="aviso" hidden>
      <p data-aviso></p>
    </div>

    <section data-vista="editor" hidden>
      <div class="intro">
        <p>Cambia precios, nombres, descripciones y fotos, y toca <strong>Guardar y publicar</strong>. La página se actualiza sola en 1 o 2 minutos.</p>
        <div class="intro-acciones">
          <a href="/" target="_blank" rel="noopener">Ver la página</a>
          <button class="link" type="button" data-salir>Salir</button>
        </div>
      </div>
      <div data-grupos></div>
    </section>
  </main>

  <footer class="barra" data-barra hidden>
    <p class="barra-estado" aria-live="polite" data-estado>Sin cambios</p>
    <div class="barra-acciones">
      <button class="btn btn-sec" type="button" data-deshacer hidden>Deshacer</button>
      <button class="btn" type="button" data-guardar disabled>Guardar y publicar</button>
    </div>
  </footer>

  <dialog class="dialogo" data-confirmar>
    <h2>¿Publicar estos cambios?</h2>
    <ul class="resumen" data-resumen></ul>
    <div class="dialogo-acciones">
      <button class="btn btn-sec" type="button" data-cancelar>Revisar</button>
      <button class="btn" type="button" data-publicar>Sí, publicar</button>
    </div>
  </dialog>

  <script>
    (function () {
      "use strict";

      var API = "/api/panel";
      var MINIMO = 1000;
      var FOTO_LADO_MAX = 1400;     // px del lado más largo tras comprimir
      var MINI_LADO_MAX = 480;      // px de la versión pequeña (miniaturas de masajes y faciales)
      var FOTOS_POR_SERVICIO = 3;
      var ENVIO_MAX = 3800000;      // bytes del pedido (Vercel acepta hasta 4,5 MB)
      var ALT_GENERAL = "Olivé Spa, spa a domicilio en Medellín";
      var ETIQUETAS = { nombre: "Nombre", detalle: "Duración / detalle", descripcion: "Descripción" };
      var ORDEN_CAMPOS = ["nombre", "detalle", "descripcion"];

      var $ = function (sel, scope) { return (scope || document).querySelector(sel); };
      var $$ = function (sel, scope) { return Array.prototype.slice.call((scope || document).querySelectorAll(sel)); };

      var servicios = [];   // ver leerModelo()
      var fotosPagina = []; // fotos que no son de un servicio (portada, secciones)
      var ronda = 0;        // verificación de publicación en curso
      var dialogo = $("[data-confirmar]");
      var login = $("[data-login]");

      function crear(etiqueta, clase, html) {
        var el = document.createElement(etiqueta);
        if (clase) el.className = clase;
        if (html) el.innerHTML = html;
        return el;
      }
      function formatear(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
      function numero(texto) { var d = String(texto).replace(/\D/g, ""); return d ? parseInt(d, 10) : 0; }
      /* La cajita crece con el precio para que el $ quede pegado al número. */
      function ajustar(input) { input.style.width = Math.max(input.value.length, 5) + 0.6 + "ch"; }
      /* La casilla de descripción crece con el texto para que se lea completo. */
      function crecer(area) {
        if (area.tagName !== "TEXTAREA" || !area.offsetParent) return;
        area.style.height = "auto";
        area.style.height = area.scrollHeight + 2 + "px";
      }
      /* Misma limpieza que hace el servidor, para saber si un texto cambió de verdad. */
      function normalizar(valor, campo) {
        var t = String(valor || "").replace(/\r\n?/g, "\n");
        if (campo === "descripcion") {
          return t.split("\n").map(function (l) { return l.replace(/\s+/g, " ").trim(); }).join("\n").replace(/\n{3,}/g, "\n\n").trim();
        }
        return t.replace(/\s+/g, " ").trim();
      }
      function textoDe(el) {
        var copia = el.cloneNode(true);
        $$("br", copia).forEach(function (br) { br.replaceWith("\n"); });
        return copia.textContent;
      }
      function urlSitio(ruta) { return new URL(ruta, location.origin + "/").href; }
      function resumir(texto, max) {
        var linea = texto.replace(/\s+/g, " ").trim();
        return linea.length > max ? linea.slice(0, max - 1) + "…" : linea;
      }

      function mostrar(vista) {
        $$("[data-vista]").forEach(function (el) { el.hidden = el.getAttribute("data-vista") !== vista; });
        $("[data-barra]").hidden = vista !== "editor";
      }
      function estado(texto, tipo) {
        var el = $("[data-estado]");
        el.textContent = texto;
        el.className = "barra-estado" + (tipo ? " " + tipo : "");
      }
      function aviso(texto) {
        $("[data-aviso]").textContent = texto;
        mostrar("aviso");
      }

      function api(metodo, accion, datos) {
        return fetch(API + (accion ? "?accion=" + accion : ""), {
          method: metodo,
          credentials: "same-origin",
          cache: "no-store",
          headers: datos ? { "Content-Type": "application/json" } : {},
          body: datos ? JSON.stringify(datos) : undefined
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (cuerpo) {
            return { estado: r.status, cuerpo: cuerpo };
          });
        });
      }

      /* Lee de la página lo que se puede editar: data-tarifa, data-texto, data-galeria y data-foto. */
      function leerModelo(html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var porId = {};
        var orden = [];
        function servicio(id, el) {
          if (!porId[id]) {
            var seccion = el.closest("section");
            var kicker = seccion && seccion.querySelector(".kicker");
            porId[id] = { id: id, grupo: kicker ? kicker.textContent.trim() : "Otros", precio: null, campos: {}, foto: null, galeria: null };
            orden.push(id);
          }
          return porId[id];
        }
        $$("[data-tarifa]", doc).forEach(function (el) {
          var s = servicio(el.getAttribute("data-tarifa"), el);
          var siguiente = el.nextElementSibling;
          s.precio = { base: numero(el.textContent), nota: siguiente && siguiente.tagName === "SMALL" ? siguiente.textContent.trim() : "" };
        });
        $$("[data-texto]", doc).forEach(function (el) {
          var partes = el.getAttribute("data-texto").split(":");
          servicio(partes[0], el).campos[partes[1]] = { base: normalizar(textoDe(el), partes[1]) };
        });
        $$("[data-galeria]", doc).forEach(function (el) {
          var fotosGaleria = $$("img", el).map(function (img) {
            return { grande: img.getAttribute("data-grande") || img.getAttribute("src"), src: img.getAttribute("src") };
          });
          servicio(el.getAttribute("data-galeria"), el).galeria = {
            base: fotosGaleria.map(function (f) { return f.grande; }),
            lista: fotosGaleria
          };
        });
        var fotos = [];
        $$("img[data-foto]", doc).forEach(function (el) {
          var id = el.getAttribute("data-foto");
          var foto = { id: id, src: el.getAttribute("src"), etiqueta: el.getAttribute("data-foto-etiqueta") || "", pendiente: null };
          if (porId[id]) porId[id].foto = foto;
          else fotos.push(foto);
        });
        return { servicios: orden.map(function (id) { return porId[id]; }), fotos: fotos };
      }

      function nombreActual(s) {
        return s.campos.nombre ? normalizar(s.campos.nombre.input.value, "nombre") || s.campos.nombre.base : s.id;
      }

      /* Convierte la foto elegida a JPEG liviano: grande (máx. 1400 px) y pequeña (máx. 480 px). */
      function prepararFoto(archivo) {
        return new Promise(function (resolver, rechazar) {
          if (archivo.type && !/^image\//.test(archivo.type)) { rechazar(new Error("Ese archivo no es una foto.")); return; }
          var url = URL.createObjectURL(archivo);
          var img = new Image();
          img.onload = function () {
            var version = function (lado, calidad) {
              var escala = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
              var lienzo = document.createElement("canvas");
              lienzo.width = Math.round(img.naturalWidth * escala);
              lienzo.height = Math.round(img.naturalHeight * escala);
              var g = lienzo.getContext("2d");
              g.imageSmoothingQuality = "high";
              g.drawImage(img, 0, 0, lienzo.width, lienzo.height);
              var datosUrl = lienzo.toDataURL("image/jpeg", calidad);
              if (datosUrl.length > 3500000) datosUrl = lienzo.toDataURL("image/jpeg", 0.7);
              return datosUrl;
            };
            var grande = version(FOTO_LADO_MAX, 0.82);
            var mini = version(MINI_LADO_MAX, 0.78);
            URL.revokeObjectURL(url);
            resolver({ url: grande, datos: grande.split(",")[1], mini: mini.split(",")[1] });
          };
          img.onerror = function () { URL.revokeObjectURL(url); rechazar(new Error("No se pudo leer esa foto. Prueba con otra (JPG o PNG).")); };
          img.src = url;
        });
      }

      /* Casilla de foto: miniatura + botón para elegir otra. `foto` es el objeto del modelo. */
      function campoFoto(foto) {
        var caja = crear("div", "foto-campo",
          '<img class="miniatura" alt="" />' +
          '<div class="foto-acciones">' +
            '<label class="btn btn-sec btn-foto">Cambiar foto<input type="file" accept="image/*" hidden /></label>' +
            '<button class="link" type="button" hidden>Quitar foto nueva</button>' +
            '<p class="foto-estado">Se ajusta sola al tamaño de la página.</p>' +
          "</div>");
        var mini = $(".miniatura", caja);
        var entrada = $("input", caja);
        var quitar = $("button", caja);
        var texto = $(".foto-estado", caja);
        mini.src = urlSitio(foto.src);
        foto.mini = mini;
        foto.reiniciar = function () {
          foto.pendiente = null;
          mini.src = foto.previa || urlSitio(foto.src);
          quitar.hidden = true;
          entrada.value = "";
          texto.textContent = "Se ajusta sola al tamaño de la página.";
        };
        entrada.addEventListener("change", function () {
          var archivo = entrada.files && entrada.files[0];
          if (!archivo) return;
          texto.textContent = "Preparando la foto…";
          prepararFoto(archivo).then(function (lista) {
            foto.pendiente = lista;
            mini.src = lista.url;
            quitar.hidden = false;
            texto.textContent = "Foto nueva lista para publicar.";
            actualizar();
          }).catch(function (error) {
            texto.textContent = error.message;
            entrada.value = "";
          });
        });
        quitar.addEventListener("click", function () { foto.reiniciar(); actualizar(); });
        return caja;
      }

      /* ¿Cambió la galería? Las fotos que ya estaban son los mismos objetos; las nuevas no. */
      function galeriaCambio(g) {
        return g.lista.length !== g.inicial.length || g.lista.some(function (f, i) { return f !== g.inicial[i]; });
      }
      function vistaFoto(f) { return f.nueva ? f.nueva.url : f.previa || urlSitio(f.src); }

      /* Fotos del servicio (máximo 3): agregar, quitar y elegir la principal (la primera). */
      function campoGaleria(s) {
        var g = s.galeria;
        g.inicial = g.lista.slice();
        var caja = crear("div", "campo",
          'Fotos <span class="nota-campo">(máximo ' + FOTOS_POR_SERVICIO + "; la primera es la principal)</span>" +
          '<div class="galeria-editor"></div><p class="foto-estado"></p>');
        var rejilla = $(".galeria-editor", caja);
        var texto = $(".foto-estado", caja);
        g.pintar = function () {
          rejilla.textContent = "";
          g.lista.forEach(function (f, i) {
            var fig = crear("figure", "gal-foto" + (f.nueva ? " nueva" : ""), '<img alt="" /><div class="gal-acciones"></div>');
            $("img", fig).src = vistaFoto(f);
            if (i === 0) fig.insertAdjacentHTML("afterbegin", '<span class="gal-principal">Principal</span>');
            var acciones = $(".gal-acciones", fig);
            if (i > 0) {
              var principal = crear("button", "", "Principal");
              principal.type = "button";
              principal.setAttribute("data-principal", "");
              principal.addEventListener("click", function () { g.lista.unshift(g.lista.splice(i, 1)[0]); g.pintar(); actualizar(); });
              acciones.appendChild(principal);
            }
            var quitar = crear("button", "", "Quitar");
            quitar.type = "button";
            quitar.setAttribute("data-quitar", "");
            quitar.addEventListener("click", function () { g.lista.splice(i, 1); g.pintar(); actualizar(); });
            acciones.appendChild(quitar);
            rejilla.appendChild(fig);
          });
          if (g.lista.length < FOTOS_POR_SERVICIO) {
            var agregar = crear("label", "gal-agregar", '+ Agregar foto<input type="file" accept="image/*" multiple hidden />');
            var entrada = $("input", agregar);
            entrada.addEventListener("change", function () {
              var archivos = Array.prototype.slice.call(entrada.files || [], 0, FOTOS_POR_SERVICIO - g.lista.length);
              if (!archivos.length) return;
              texto.textContent = archivos.length === 1 ? "Preparando la foto…" : "Preparando las fotos…";
              Promise.all(archivos.map(prepararFoto)).then(function (listas) {
                listas.forEach(function (l) { if (g.lista.length < FOTOS_POR_SERVICIO) g.lista.push({ nueva: l }); });
                texto.textContent = "";
                g.pintar();
                actualizar();
              }).catch(function (error) {
                texto.textContent = error.message;
                entrada.value = "";
              });
            });
            rejilla.appendChild(agregar);
          }
        };
        g.reiniciar = function () {
          g.lista = g.inicial.slice();
          texto.textContent = "";
          g.pintar();
        };
        g.pintar();
        return caja;
      }

      function pintar(modelo) {
        var contenedor = $("[data-grupos]");
        contenedor.textContent = "";
        servicios = modelo.servicios;
        fotosPagina = modelo.fotos;
        var bloques = {};
        function bloque(titulo) {
          if (!bloques[titulo]) {
            var b = crear("section", "card grupo");
            var h = crear("h2");
            h.textContent = titulo;
            b.appendChild(h);
            contenedor.appendChild(b);
            bloques[titulo] = b;
          }
          return bloques[titulo];
        }

        servicios.forEach(function (s) {
          var fila = crear("div", "fila",
            '<div class="fila-principal">' +
              '<div class="fila-texto"><span class="fila-nombre"></span><span class="fila-detalle"></span></div>' +
            "</div>" +
            '<button class="editar" type="button" aria-expanded="false"></button>' +
            '<div class="edicion" hidden></div>');
          var principal = $(".fila-principal", fila);
          var edicion = $(".edicion", fila);
          var boton = $(".editar", fila);
          s.fila = fila;
          s.titulo = $(".fila-nombre", fila);
          s.subtitulo = $(".fila-detalle", fila);

          if (s.precio) {
            var etiqueta = crear("label", "precio", "$<input inputmode=\"numeric\" autocomplete=\"off\" enterkeyhint=\"done\" />");
            var entrada = $("input", etiqueta);
            entrada.value = formatear(s.precio.base);
            ajustar(entrada);
            entrada.addEventListener("focus", function () { entrada.select(); });
            entrada.addEventListener("input", function () {
              var n = numero(entrada.value);
              entrada.value = n ? formatear(n) : "";
              ajustar(entrada);
              actualizar();
            });
            entrada.addEventListener("keydown", function (e) { if (e.key === "Enter") entrada.blur(); });
            principal.appendChild(etiqueta);
            if (s.precio.nota) { var nota = crear("span", "precio-nota"); nota.textContent = s.precio.nota; principal.appendChild(nota); }
            s.precio.input = entrada;
            s.precio.caja = etiqueta;
          }
          s.aviso = crear("span", "fila-aviso");
          principal.appendChild(s.aviso);

          ORDEN_CAMPOS.forEach(function (campo) {
            var info = s.campos[campo];
            if (!info) return;
            var multilinea = campo === "descripcion";
            var caja = crear("label", "campo");
            caja.appendChild(document.createTextNode(ETIQUETAS[campo]));
            var control = document.createElement(multilinea ? "textarea" : "input");
            control.maxLength = multilinea ? 700 : 90;
            if (multilinea) { control.rows = 3; control.placeholder = "Escribe aquí la descripción (opcional)"; }
            control.value = info.base;
            control.addEventListener("input", function () { crecer(control); actualizar(); });
            caja.appendChild(control);
            edicion.appendChild(caja);
            info.input = control;
            info.caja = caja;
          });
          if (s.foto) {
            var cajaFoto = crear("div", "campo");
            cajaFoto.appendChild(document.createTextNode("Foto"));
            cajaFoto.appendChild(campoFoto(s.foto));
            edicion.appendChild(cajaFoto);
          }
          if (s.galeria) edicion.appendChild(campoGaleria(s));

          var partes = ["nombre"];
          if (s.campos.descripcion) partes.push("descripción");
          if (s.galeria) partes.push("fotos");
          else if (s.foto) partes.push("foto");
          var texto = "Editar " + (partes.length > 1 ? partes.slice(0, -1).join(", ") + " y " + partes[partes.length - 1] : partes[0]);
          boton.textContent = texto;
          boton.addEventListener("click", function () {
            var abrir = edicion.hidden;
            edicion.hidden = !abrir;
            boton.setAttribute("aria-expanded", abrir ? "true" : "false");
            boton.textContent = abrir ? "Cerrar" : texto;
            if (abrir && s.campos.descripcion) {
              crecer(s.campos.descripcion.input);
              if (!s.campos.descripcion.input.value) s.campos.descripcion.input.focus();
            }
          });
          bloque(s.grupo).appendChild(fila);
        });

        if (fotosPagina.length) {
          var grupoFotos = bloque("Fotos de la página");
          fotosPagina.forEach(function (f) {
            var fila = crear("div", "fila foto-fila", '<span class="fila-nombre"></span>');
            $(".fila-nombre", fila).textContent = f.etiqueta || f.id;
            fila.appendChild(campoFoto(f));
            f.fila = fila;
            grupoFotos.appendChild(fila);
          });
        }
      }

      /* Lista de cambios sin guardar, con lo que había antes y lo nuevo. */
      function pendientes() {
        var lista = [];
        servicios.forEach(function (s) {
          if (s.precio) {
            var n = numero(s.precio.input.value);
            if (n !== s.precio.base) lista.push({ tipo: "precio", s: s, antes: s.precio.base, despues: n });
          }
          ORDEN_CAMPOS.forEach(function (campo) {
            var info = s.campos[campo];
            if (!info) return;
            var valor = normalizar(info.input.value, campo);
            if (valor !== info.base) lista.push({ tipo: "texto", s: s, campo: campo, antes: info.base, despues: valor });
          });
          if (s.foto && s.foto.pendiente) lista.push({ tipo: "foto", s: s, foto: s.foto });
          if (s.galeria && galeriaCambio(s.galeria)) lista.push({ tipo: "galeria", s: s });
        });
        fotosPagina.forEach(function (f) { if (f.pendiente) lista.push({ tipo: "foto", foto: f }); });
        return lista;
      }

      function avisoPrecio(n, antes) {
        if (n % 1000 !== 0) return "¿Seguro? No termina en 000";
        if (antes && (n > antes * 1.5 || n < antes * 0.5)) return "Cambio grande: revisa que esté bien";
        return "";
      }

      function actualizar() {
        var malos = 0;
        servicios.forEach(function (s) {
          var cambiado = false;
          var invalido = false;
          var mensajes = [];
          if (s.precio) {
            var n = numero(s.precio.input.value);
            var precioCambio = n !== s.precio.base;
            s.precio.caja.classList.toggle("modificado", precioCambio);
            if (n < MINIMO) { invalido = true; mensajes.push("Escribe un precio válido"); }
            else if (precioCambio) {
              cambiado = true;
              mensajes.push("Antes: $" + formatear(s.precio.base));
              var extra = avisoPrecio(n, s.precio.base);
              if (extra) mensajes.push(extra);
            } else if (n % 1000 !== 0) mensajes.push("Revisa este precio: no termina en 000");
          }
          ORDEN_CAMPOS.forEach(function (campo) {
            var info = s.campos[campo];
            if (!info) return;
            var valor = normalizar(info.input.value, campo);
            var distinto = valor !== info.base;
            var vacio = campo === "nombre" && !valor;
            info.caja.classList.toggle("modificado", distinto && !vacio);
            info.caja.classList.toggle("invalido", vacio);
            if (vacio) { invalido = true; mensajes.push("El nombre no puede quedar vacío"); }
            else if (distinto) cambiado = true;
          });
          if (s.foto && s.foto.pendiente) { cambiado = true; mensajes.push("Foto nueva"); }
          if (s.galeria && galeriaCambio(s.galeria)) { cambiado = true; mensajes.push("Fotos cambiadas"); }
          if (invalido) malos++;
          s.titulo.textContent = nombreActual(s);
          s.subtitulo.textContent = s.campos.detalle ? normalizar(s.campos.detalle.input.value, "detalle") : "";
          s.fila.classList.toggle("cambiado", cambiado && !invalido);
          s.fila.classList.toggle("invalido", invalido);
          s.aviso.textContent = mensajes.join(" · ");
        });
        fotosPagina.forEach(function (f) { f.fila.classList.toggle("cambiado", !!f.pendiente); });

        var lista = pendientes();
        $("[data-guardar]").disabled = !lista.length || malos > 0;
        $("[data-deshacer]").hidden = !lista.length;
        if (malos) estado("Revisa lo marcado en rojo", "error");
        else if (lista.length) estado(lista.length === 1 ? "1 cambio sin guardar" : lista.length + " cambios sin guardar");
        else estado("Sin cambios");
      }

      function cargar() {
        if (servicios.length) { mostrar("editor"); actualizar(); return; }
        mostrar("cargando");
        api("GET").then(function (r) {
          if (r.estado === 200 && r.cuerpo.html) {
            pintar(leerModelo(r.cuerpo.html));
            mostrar("editor");
            actualizar();
          } else if (r.estado === 401) {
            pedirLogin("");
          } else {
            aviso(r.cuerpo.error || "No se pudo abrir el panel. Recarga la página.");
          }
        }).catch(function () {
          aviso("No hay conexión con el panel. Revisa el internet y recarga la página.");
        });
      }

      function pedirLogin(mensaje) {
        $("[data-error-login]").textContent = mensaje;
        mostrar("login");
        login.usuario.focus();
      }

      login.addEventListener("submit", function (e) {
        e.preventDefault();
        var usuario = login.usuario.value.trim();
        var clave = login.clave.value;
        var error = $("[data-error-login]");
        if (!usuario || !clave) { error.textContent = "Escribe tu usuario y tu contraseña."; return; }
        var boton = $("[data-entrar]");
        boton.disabled = true;
        boton.textContent = "Entrando…";
        error.textContent = "";
        api("POST", "entrar", { usuario: usuario, clave: clave }).then(function (r) {
          if (r.estado === 200) { login.clave.value = ""; cargar(); }
          else error.textContent = r.cuerpo.error || "No se pudo entrar. Intenta de nuevo.";
        }).catch(function () {
          error.textContent = "No hay conexión. Revisa el internet e intenta de nuevo.";
        }).then(function () {
          boton.disabled = false;
          boton.textContent = "Entrar";
        });
      });

      $("[data-ver-clave]").addEventListener("click", function () {
        var visible = login.clave.type === "text";
        login.clave.type = visible ? "password" : "text";
        this.textContent = visible ? "Ver" : "Ocultar";
        this.setAttribute("aria-label", visible ? "Mostrar contraseña" : "Ocultar contraseña");
      });

      $("[data-deshacer]").addEventListener("click", function () {
        servicios.forEach(function (s) {
          if (s.precio) { s.precio.input.value = formatear(s.precio.base); ajustar(s.precio.input); }
          ORDEN_CAMPOS.forEach(function (campo) {
            if (!s.campos[campo]) return;
            s.campos[campo].input.value = s.campos[campo].base;
            crecer(s.campos[campo].input);
          });
          if (s.foto) s.foto.reiniciar();
          if (s.galeria) s.galeria.reiniciar();
        });
        fotosPagina.forEach(function (f) { f.reiniciar(); });
        actualizar();
      });

      /* Arma la ventana de confirmación con cada cambio (y avisos de precios raros). */
      $("[data-guardar]").addEventListener("click", function () {
        var lista = pendientes();
        if (!lista.length) return;
        var resumen = $("[data-resumen]");
        resumen.textContent = "";
        var porElemento = {}; // un solo recuadro por servicio o foto, con todos sus cambios
        lista.forEach(function (c) {
          var clave = c.s ? "s:" + c.s.id : "f:" + c.foto.id;
          var li = porElemento[clave];
          if (!li) {
            li = porElemento[clave] = crear("li", "", '<span class="r-titulo"></span>');
            $(".r-titulo", li).textContent = c.s ? nombreActual(c.s) : (c.foto.etiqueta || c.foto.id);
            resumen.appendChild(li);
          }
          var detalle = crear("span", "r-detalle");
          li.appendChild(detalle);
          if (c.tipo === "precio") {
            detalle.innerHTML = "Precio: <s></s> → <strong></strong>";
            $("s", detalle).textContent = "$" + formatear(c.antes);
            $("strong", detalle).textContent = "$" + formatear(c.despues);
            var extra = avisoPrecio(c.despues, c.antes);
            if (extra) { var av = crear("span", "r-aviso"); av.textContent = "⚠ " + extra; li.appendChild(av); }
          } else if (c.tipo === "texto") {
            var etiqueta = ETIQUETAS[c.campo];
            detalle.textContent = !c.despues ? etiqueta + ": se borra" : etiqueta + (c.antes ? ": «" : " (nueva): «") + resumir(c.despues, 90) + "»";
          } else if (c.tipo === "galeria") {
            var fotosG = c.s.galeria.lista;
            var nuevasG = fotosG.filter(function (f) { return f.nueva; }).length;
            detalle.textContent = !fotosG.length ? "Fotos: se quitan todas" :
              "Fotos: " + fotosG.length + (nuevasG ? " (" + nuevasG + (nuevasG === 1 ? " nueva)" : " nuevas)") : "");
            var filaFotos = crear("div", "r-fotos");
            fotosG.forEach(function (f) {
              var miniG = crear("img");
              miniG.alt = "";
              miniG.src = vistaFoto(f);
              filaFotos.appendChild(miniG);
            });
            li.appendChild(filaFotos);
          } else {
            detalle.textContent = "Foto nueva";
            var mini = crear("img");
            mini.alt = "";
            mini.src = c.foto.pendiente.url;
            li.appendChild(mini);
          }
        });
        dialogo.showModal();
      });

      $("[data-cancelar]").addEventListener("click", function () { dialogo.close(); });

      $("[data-publicar]").addEventListener("click", function () {
        var lista = pendientes();
        var pedido = { precios: {}, textos: {}, fotos: {}, galerias: {} };
        lista.forEach(function (c) {
          if (c.tipo === "precio") pedido.precios[c.s.id] = c.despues;
          else if (c.tipo === "texto") pedido.textos[c.s.id + ":" + c.campo] = c.despues;
          else if (c.tipo === "foto") pedido.fotos[c.foto.id] = { datos: c.foto.pendiente.datos, alt: c.s ? nombreActual(c.s) : ALT_GENERAL };
        });
        // Las fotos se envían si cambiaron, o si cambió el nombre (para actualizar su texto alternativo).
        servicios.forEach(function (s) {
          if (!s.galeria) return;
          var nombreCambio = s.campos.nombre && normalizar(s.campos.nombre.input.value, "nombre") !== s.campos.nombre.base;
          if (!galeriaCambio(s.galeria) && !(nombreCambio && s.galeria.lista.length)) return;
          pedido.galerias[s.id] = {
            alt: nombreActual(s),
            fotos: s.galeria.lista.map(function (f) { return f.nueva ? { datos: f.nueva.datos, mini: f.nueva.mini } : { grande: f.grande }; })
          };
        });
        var envio = JSON.stringify(pedido);
        if (envio.length > ENVIO_MAX) {
          dialogo.close();
          estado("Son muchas fotos a la vez. Publica primero algunas y luego el resto.", "error");
          return;
        }
        var boton = this;
        boton.disabled = true;
        boton.textContent = "Publicando…";
        api("POST", "guardar", pedido).then(function (r) {
          dialogo.close();
          if (r.estado === 401) {
            pedirLogin("Tu sesión terminó. Entra de nuevo y vuelve a tocar Guardar: tus cambios siguen ahí.");
            return;
          }
          if (r.estado !== 200) { estado(r.cuerpo.error || "No se pudo guardar. Intenta de nuevo.", "error"); return; }
          var rutas = r.cuerpo.fotos || {};
          var galeriasFinales = r.cuerpo.galerias || {};
          lista.forEach(function (c) {
            if (c.tipo === "precio") c.s.precio.base = c.despues;
            else if (c.tipo === "texto") c.s.campos[c.campo].base = c.despues;
            else if (c.tipo === "foto" && rutas[c.foto.id]) {
              c.foto.src = rutas[c.foto.id];
              c.foto.previa = c.foto.pendiente.url; // la foto nueva tarda en estar en la página
              c.foto.reiniciar();
            }
          });
          Object.keys(galeriasFinales).forEach(function (id) {
            var s = servicios.filter(function (x) { return x.id === id; })[0];
            if (!s || !s.galeria) return;
            // Se sigue mostrando la vista previa de las fotos nuevas mientras Vercel publica.
            s.galeria.lista = galeriasFinales[id].map(function (f, i) {
              var antes = s.galeria.lista[i];
              return { grande: f.grande, src: f.src, previa: antes && antes.nueva ? antes.nueva.url : antes && antes.previa };
            });
            s.galeria.inicial = s.galeria.lista.slice();
            s.galeria.pintar();
          });
          actualizar();
          estado("Guardado ✓ Publicando en la página…", "ok");
          verificarPublicacion(pedido, rutas, galeriasFinales);
        }).catch(function () {
          dialogo.close();
          estado("No hay conexión. Revisa el internet e intenta de nuevo.", "error");
        }).then(function () {
          boton.disabled = false;
          boton.textContent = "Sí, publicar";
        });
      });

      /* Revisa la página pública hasta que muestre todo lo guardado. */
      function verificarPublicacion(pedido, rutas, galerias) {
        var mia = ++ronda;
        var inicio = Date.now();
        var avisar = function (texto) { if (mia === ronda && !pendientes().length) estado(texto, "ok"); };
        var seguir = function () {
          if (mia !== ronda) return;
          if (Date.now() - inicio > 4 * 60 * 1000) { avisar("Guardado ✓ Puede tardar unos minutos más en verse en la página."); return; }
          setTimeout(revisar, 8000);
        };
        var revisar = function () {
          fetch("/?v=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (html) {
            var vivo = leerModelo(html);
            var porId = {};
            vivo.servicios.forEach(function (s) { porId[s.id] = s; });
            var fotosVivas = {};
            vivo.fotos.forEach(function (f) { fotosVivas[f.id] = f.src; });
            vivo.servicios.forEach(function (s) { if (s.foto) fotosVivas[s.id] = s.foto.src; });
            var listo = Object.keys(pedido.precios).every(function (id) {
              return porId[id] && porId[id].precio && porId[id].precio.base === pedido.precios[id];
            }) && Object.keys(pedido.textos).every(function (clave) {
              var partes = clave.split(":");
              var s = porId[partes[0]];
              return s && s.campos[partes[1]] && s.campos[partes[1]].base === pedido.textos[clave];
            }) && Object.keys(rutas).every(function (id) { return fotosVivas[id] === rutas[id]; })
              && Object.keys(galerias).every(function (id) {
                var viva = porId[id] && porId[id].galeria;
                return viva && viva.base.join("|") === galerias[id].map(function (f) { return f.grande; }).join("|");
              });
            if (listo) avisar("Publicado ✓ Los cambios ya están en la página.");
            else seguir();
          }).catch(seguir);
        };
        setTimeout(revisar, 5000);
      }

      $("[data-salir]").addEventListener("click", function () {
        if (pendientes().length && !confirm("Tienes cambios sin guardar. ¿Salir de todas formas?")) return;
        api("POST", "salir", {}).catch(function () {}).then(function () {
          servicios = [];
          fotosPagina = [];
          ronda++;
          $("[data-grupos]").textContent = "";
          pedirLogin("");
        });
      });

      window.addEventListener("beforeunload", function (e) {
        if (pendientes().length) { e.preventDefault(); e.returnValue = ""; }
      });

      cargar();
    })();
  </script>
</body>
</html>
